services:
  stockup:
    build: .
    image: stockup:local
    restart: unless-stopped
    ports:
      - "${STOCKUP_PORT:-8080}:8080"
    environment:
      STOCKUP_DATABASE_URL: postgres://stockup:${POSTGRES_PASSWORD:-stockup}@postgres:5432/stockup
      STOCKUP_AUTH_SECRET: ${STOCKUP_AUTH_SECRET:?set STOCKUP_AUTH_SECRET to a random string of at least 32 characters, e.g. openssl rand -base64 32}
      # MCP is served only over HTTPS. The server then fetches its own signing keys from this URL, so it has
      # to be reachable from the container too.
      STOCKUP_BASE_URL: ${STOCKUP_BASE_URL:?set STOCKUP_BASE_URL to the public URL members open, e.g. https://stockup.example.com}
      # Screenshot recognition reads screenshots with this provider, and stays unavailable while all are empty; setting
      # only some fails the boot. PROVIDER is anthropic or openai, and it and API_KEY are required. MODEL defaults to
      # claude-haiku-5-5 or gpt-5-mini. BASE_URL points the openai provider at an OpenAI-compatible service, e.g.
      # https://openrouter.ai/api/v1 with a MODEL such as google/gemini-3-flash; the model must read images.
      # MONTHLY_QUOTA is also required: how many screenshots each household may have recognized with this provider a
      # month, counting those that produced drafts or are still running; 0 offers none. Months start on the 1st in
      # the server's time zone.
      STOCKUP_RECOGNITION_PROVIDER: ${STOCKUP_RECOGNITION_PROVIDER:-}
      STOCKUP_RECOGNITION_API_KEY: ${STOCKUP_RECOGNITION_API_KEY:-}
      STOCKUP_RECOGNITION_BASE_URL: ${STOCKUP_RECOGNITION_BASE_URL:-}
      STOCKUP_RECOGNITION_MODEL: ${STOCKUP_RECOGNITION_MODEL:-}
      STOCKUP_RECOGNITION_MONTHLY_QUOTA: ${STOCKUP_RECOGNITION_MONTHLY_QUOTA:-}
      # Lets household admins give their household a provider and API key of its own, used instead of the quota above
      # and never falling back to it. The keys are encrypted with this one: 32 random bytes in base64, e.g.
      # openssl rand -base64 32. Without it the setting is not offered. Keep it with your backups: changing or losing it
      # leaves every household's key unreadable until its admin enters it again.
      STOCKUP_ENCRYPTION_KEY: ${STOCKUP_ENCRYPTION_KEY:-}
      # The header carrying the client address for rate limiting, e.g. CF-Connecting-IP behind Cloudflare. Trust it
      # only when the server is reachable solely through that proxy, since clients can set it themselves otherwise.
      STOCKUP_CLIENT_IP_HEADER: ${STOCKUP_CLIENT_IP_HEADER:-}
      # Evidence goes to an S3-compatible bucket (AWS, Cloudflare R2, RustFS, ...) once these are set, and stays in the
      # volume below while all are empty. Setting only some fails the boot, as does a bucket the server cannot write,
      # read and delete in. The bucket stays private: members read evidence through the server. Region defaults to
      # us-east-1 (R2 takes auto); set PATH_STYLE=true for servers that do not route buckets by subdomain, e.g. RustFS.
      # To move an instance that already keeps evidence in the volume, set these and run
      #   docker compose run --rm --no-deps stockup bun packages/server/src/migrate-evidence.ts
      # before `docker compose up -d`. It copies every file under its own key, skips keys the bucket already has (so
      # it is safe to rerun), prints uploaded/skipped/failed counts and exits non-zero if any failed. The volume is
      # left as it was; remove it yourself once the bucket is trusted.
      STOCKUP_S3_ENDPOINT: ${STOCKUP_S3_ENDPOINT:-}
      STOCKUP_S3_REGION: ${STOCKUP_S3_REGION:-}
      STOCKUP_S3_BUCKET: ${STOCKUP_S3_BUCKET:-}
      STOCKUP_S3_ACCESS_KEY_ID: ${STOCKUP_S3_ACCESS_KEY_ID:-}
      STOCKUP_S3_SECRET_ACCESS_KEY: ${STOCKUP_S3_SECRET_ACCESS_KEY:-}
      STOCKUP_S3_PATH_STYLE: ${STOCKUP_S3_PATH_STYLE:-}
      # Verification codes go out through this SMTP server; without it, nothing that needs email is offered. Setting
      # only some fails the boot. HOST and FROM ("StockUp <noreply@example.com>" or a bare address) are required. TLS is
      # starttls (the default, required rather than opportunistic), implicit or none; PORT defaults to 587, 465 or 25 to
      # match. Leave USERNAME empty for a server that takes mail without logging in.
      STOCKUP_SMTP_HOST: ${STOCKUP_SMTP_HOST:-}
      STOCKUP_SMTP_PORT: ${STOCKUP_SMTP_PORT:-}
      STOCKUP_SMTP_USERNAME: ${STOCKUP_SMTP_USERNAME:-}
      STOCKUP_SMTP_PASSWORD: ${STOCKUP_SMTP_PASSWORD:-}
      STOCKUP_SMTP_FROM: ${STOCKUP_SMTP_FROM:-}
      STOCKUP_SMTP_TLS: ${STOCKUP_SMTP_TLS:-}
      # open lets anyone register with an emailed code and get a household of their own; it requires SMTP.
      STOCKUP_SIGNUP: ${STOCKUP_SIGNUP:-closed}
      # Cloudflare Turnstile challenges signup, code sending, sign-in (MCP authorization included), password reset and
      # joining once both keys are set; setting only one fails the boot. Requests are refused while Cloudflare cannot
      # be reached. Set STOCKUP_CLIENT_IP_HEADER behind a proxy so Cloudflare sees the visitor's address.
      STOCKUP_TURNSTILE_SITE_KEY: ${STOCKUP_TURNSTILE_SITE_KEY:-}
      STOCKUP_TURNSTILE_SECRET_KEY: ${STOCKUP_TURNSTILE_SECRET_KEY:-}
      # Nothing is reported anywhere while these are empty. The server's own failures (5xx responses and failed
      # background recognitions, never 4xx) go to a GlitchTip or Sentry project of yours at this DSN, with only the
      # route template, method, status, release, error message and stack.
      STOCKUP_SERVER_GLITCHTIP_DSN: ${STOCKUP_SERVER_GLITCHTIP_DSN:-}
      # Front-end analytics (Umami) and errors (GlitchTip) need both; setting only one fails the boot. Members can turn
      # them off in their settings. The browser posts to this instance only, so the reverse proxy in front of it must
      # forward /_s/api/send to Umami and /_e/api/<project id>/envelope/ to GlitchTip, each with the prefix stripped. The
      # GlitchTip key travels in the X-Sentry-Auth header, which the proxy must pass on.
      STOCKUP_UMAMI_WEBSITE_ID: ${STOCKUP_UMAMI_WEBSITE_ID:-}
      STOCKUP_WEB_GLITCHTIP_DSN: ${STOCKUP_WEB_GLITCHTIP_DSN:-}
    volumes:
      - ${STOCKUP_EVIDENCE_PATH:-./data/evidence}:/data/evidence
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockup}
      POSTGRES_DB: stockup
    volumes:
      - stockup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockup -d stockup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockup-postgres:

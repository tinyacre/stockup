services:
  stockup:
    build: .
    image: stockup:local
    restart: unless-stopped
    ports:
      - "${STOCKUP_PORT:-8080}:8080"
    environment:
      STOCKUP_DATABASE_URL: postgres://stockup:${POSTGRES_PASSWORD:-stockup}@postgres:5432/stockup
      STOCKUP_AUTH_SECRET: ${STOCKUP_AUTH_SECRET:?set STOCKUP_AUTH_SECRET to a random string of at least 32 characters, e.g. openssl rand -base64 32}
      # MCP is served only over HTTPS. The server then fetches its own signing keys from this URL, so it has
      # to be reachable from the container too.
      STOCKUP_BASE_URL: ${STOCKUP_BASE_URL:?set STOCKUP_BASE_URL to the public URL members open, e.g. https://stockup.example.com}
      # Screenshot recognition stays unavailable without an Anthropic API key; the model defaults to claude-haiku-5-5.
      STOCKUP_ANTHROPIC_API_KEY: ${STOCKUP_ANTHROPIC_API_KEY:-}
      STOCKUP_ANTHROPIC_MODEL: ${STOCKUP_ANTHROPIC_MODEL:-}
      # The header carrying the client address for rate limiting, e.g. CF-Connecting-IP behind Cloudflare. Trust it
      # only when the server is reachable solely through that proxy, since clients can set it themselves otherwise.
      STOCKUP_CLIENT_IP_HEADER: ${STOCKUP_CLIENT_IP_HEADER:-}
      # Evidence goes to an S3-compatible bucket (AWS, Cloudflare R2, RustFS, ...) once these are set, and stays in the
      # volume below while all are empty. Setting only some fails the boot, as does a bucket the server cannot write,
      # read and delete in. The bucket stays private: members read evidence through the server. Region defaults to
      # us-east-1 (R2 takes auto); set PATH_STYLE=true for servers that do not route buckets by subdomain, e.g. RustFS.
      STOCKUP_S3_ENDPOINT: ${STOCKUP_S3_ENDPOINT:-}
      STOCKUP_S3_REGION: ${STOCKUP_S3_REGION:-}
      STOCKUP_S3_BUCKET: ${STOCKUP_S3_BUCKET:-}
      STOCKUP_S3_ACCESS_KEY_ID: ${STOCKUP_S3_ACCESS_KEY_ID:-}
      STOCKUP_S3_SECRET_ACCESS_KEY: ${STOCKUP_S3_SECRET_ACCESS_KEY:-}
      STOCKUP_S3_PATH_STYLE: ${STOCKUP_S3_PATH_STYLE:-}
    volumes:
      - ${STOCKUP_EVIDENCE_PATH:-./data/evidence}:/data/evidence
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockup}
      POSTGRES_DB: stockup
    volumes:
      - stockup-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockup -d stockup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockup-postgres:

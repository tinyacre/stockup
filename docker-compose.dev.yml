# Local Postgres for development and tests; the app runs on the host.
name: stockup-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stockup
      POSTGRES_PASSWORD: stockup
      POSTGRES_DB: stockup
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - stockup-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockup -d stockup"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  stockup-dev-postgres:
